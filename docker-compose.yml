name: medusa-stores

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 96M
    networks:
      - internal

  uc-backend:
    build:
      context: ../urban-compact
      dockerfile: deploy/docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "9000"
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD}@postgres:5432/urban_compact?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORE_CORS: ${UC_STORE_CORS}
      ADMIN_CORS: ${UC_ADMIN_CORS}
      AUTH_CORS: ${UC_AUTH_CORS}
      JWT_SECRET: ${UC_JWT_SECRET}
      COOKIE_SECRET: ${UC_COOKIE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - internal

  ps-backend:
    build:
      context: ../performance-street
      dockerfile: deploy/docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "9000"
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD}@postgres:5432/performance_street?sslmode=disable
      REDIS_URL: redis://redis:6379/1
      STORE_CORS: ${PS_STORE_CORS}
      ADMIN_CORS: ${PS_ADMIN_CORS}
      AUTH_CORS: ${PS_AUTH_CORS}
      JWT_SECRET: ${PS_JWT_SECRET}
      COOKIE_SECRET: ${PS_COOKIE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - internal

  uc-storefront:
    build:
      context: ../urban-compact
      dockerfile: deploy/docker/Dockerfile.storefront
      args:
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${UC_PUBLISHABLE_KEY}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${UC_BACKEND_PUBLIC_URL}
        NEXT_PUBLIC_BASE_URL: ${UC_STOREFRONT_URL}
        NEXT_PUBLIC_DEFAULT_REGION: ${UC_DEFAULT_REGION:-dk}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8000"
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${UC_PUBLISHABLE_KEY}
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${UC_BACKEND_PUBLIC_URL}
      NEXT_PUBLIC_BASE_URL: ${UC_STOREFRONT_URL}
      NEXT_PUBLIC_DEFAULT_REGION: ${UC_DEFAULT_REGION:-dk}
    depends_on:
      - uc-backend
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  ps-storefront:
    build:
      context: ../performance-street
      dockerfile: deploy/docker/Dockerfile.storefront
      args:
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${PS_PUBLISHABLE_KEY}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${PS_BACKEND_PUBLIC_URL}
        NEXT_PUBLIC_BASE_URL: ${PS_STOREFRONT_URL}
        NEXT_PUBLIC_DEFAULT_REGION: ${PS_DEFAULT_REGION:-dk}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8000"
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${PS_PUBLISHABLE_KEY}
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${PS_BACKEND_PUBLIC_URL}
      NEXT_PUBLIC_BASE_URL: ${PS_STOREFRONT_URL}
      NEXT_PUBLIC_DEFAULT_REGION: ${PS_DEFAULT_REGION:-dk}
    depends_on:
      - ps-backend
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - uc-storefront
      - ps-storefront
      - uc-backend
      - ps-backend
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
