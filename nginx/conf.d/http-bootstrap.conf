# Used before SSL certs exist — HTTP-only reverse proxy + ACME.
# Renamed/disabled after certbot succeeds (see scripts/setup-ssl.sh).

server {
  listen 80 default_server;
  server_name urban.hassansrour.me;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://uc-storefront:8000;
    include /etc/nginx/snippets/proxy-params.conf;
  }
}

server {
  listen 80;
  server_name api-urban.hassansrour.me;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://uc-backend:9000;
    include /etc/nginx/snippets/proxy-params.conf;
  }
}

